name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build base image
        run: docker build -t cppdev:ci .

      - name: Build devcontainer image
        run: docker build -f devcontainer.Dockerfile --build-arg BASE_IMAGE=cppdev:ci -t cppdev-devcontainer:ci .

      - name: Smoke test base image
        run: bash scripts/smoke-test.sh cppdev:ci 14

      - name: Verify devcontainer tooling
        run: |
          docker run --rm cppdev-devcontainer:ci bash -lc '
            node --version &&
            npm --version &&
            docker --version &&
            lsd --version &&
            gcc -dumpfullversion
          '

  publish:
    name: Publish images
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    environment: release
    env:
      DOCKERHUB_ENABLED: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The token is passed directly to the login action and is not exported
      # as a job-wide environment variable.
      - name: Log in to Docker Hub
        if: env.DOCKERHUB_ENABLED == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata for GHCR
        id: meta-ghcr
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/cppdev
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=tag
            type=raw,value=latest

      - name: Publish base image to GHCR
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta-ghcr.outputs.tags }}
          labels: ${{ steps.meta-ghcr.outputs.labels }}
          cache-from: type=gha,scope=base
          cache-to: type=gha,mode=max,scope=base

      - name: Extract metadata for Docker Hub
        id: meta-dockerhub
        if: env.DOCKERHUB_ENABLED == 'true'
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.DOCKERHUB_USERNAME }}/cppdev
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=tag
            type=raw,value=latest

      - name: Publish base image to Docker Hub
        if: env.DOCKERHUB_ENABLED == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta-dockerhub.outputs.tags }}
          labels: ${{ steps.meta-dockerhub.outputs.labels }}
          cache-from: type=gha,scope=base
          cache-to: type=gha,mode=max,scope=base

      - name: Extract metadata for the devcontainer image
        id: meta-devcontainer
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/cppdev
          tags: |
            type=raw,value=${{ github.ref_name }}-devcontainer
            type=raw,value=devcontainer

      - name: Publish devcontainer image to GHCR
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: devcontainer.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            BASE_IMAGE=ghcr.io/${{ github.repository_owner }}/cppdev:${{ github.ref_name }}
          tags: ${{ steps.meta-devcontainer.outputs.tags }}
          labels: ${{ steps.meta-devcontainer.outputs.labels }}
          cache-from: type=gha,scope=devcontainer-tools
          cache-to: type=gha,mode=max,scope=devcontainer-tools

      - name: Publish devcontainer image to Docker Hub
        if: env.DOCKERHUB_ENABLED == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: devcontainer.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            BASE_IMAGE=${{ env.DOCKERHUB_USERNAME }}/cppdev:${{ github.ref_name }}
          tags: |
            ${{ env.DOCKERHUB_USERNAME }}/cppdev:${{ github.ref_name }}-devcontainer
            ${{ env.DOCKERHUB_USERNAME }}/cppdev:devcontainer
          cache-from: type=gha,scope=devcontainer-tools
          cache-to: type=gha,mode=max,scope=devcontainer-tools
